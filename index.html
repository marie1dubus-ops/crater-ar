<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal Crater AR</title>

    <!-- A-Frame: the 3D scene framework -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js: adds GPS location-based AR to A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >

      <!-- Preload your GLB asset -->
      <a-assets>
        <a-asset-item id="crater-model" src="./assets/crater10.glb"></a-asset-item>
      </a-assets>

      <!-- Your crater, placed at GPS coordinates -->
      <a-entity
        gltf-model="#crater-model"
        gps-new-entity-place="latitude: 52.4875122560963; longitude: 13.422214087234323
        position="0 -10 0"
        rotation="0 45 0"
        scale="1 1 1"
      ></a-entity>

      <!-- GPS camera with smoothing to reduce jitter -->
      <a-camera
        id="camera1"
        look-controls-enabled="false"
        arjs-look-controls="smoothingFactor: 0.1"
        gps-new-camera="gpsMinDistance: 5"
      ></a-camera>

    </a-scene>
  </body>
</html>
