<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Test</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: black; }

    #video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    #canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
    }

    #log {
      position: fixed;
      top: 10px; left: 10px;
      z-index: 99;
      background: rgba(0,0,0,0.8);
      color: lime;
      padding: 10px;
      font-size: 13px;
      font-family: monospace;
      border-radius: 8px;
      max-width: 90vw;
      max-height: 50vh;
      overflow-y: auto;
    }

    #btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      padding: 16px 40px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="log">Waiting for tap...<br></div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<button id="btn">Start AR Test</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
const log = msg => {
  document.getElementById('log').innerHTML += msg + '<br>';
  console.log(msg);
};

// Three.js setup
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 0, 0);
scene.add(camera);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(100, 200, 100);
scene.add(sun);

// Load your GLB — placed 20 meters in front of you to start
const loader = new THREE.GLTFLoader();
log('Loading model...');
loader.load(
  './creat.glb/crater10.glb',   // ← replace with your actual filename
  gltf => {
    const model = gltf.scene;
    model.position.set(0, -5, -20); // 20m ahead, 5m below eye level
    scene.add(model);
    log('Model loaded ✅ — you should see it ahead of you');
  },
  xhr => {
    const pct = Math.round((xhr.loaded / xhr.total) * 100);
    log('Loading: ' + pct + '%');
  },
  err => {
    log('❌ Model error: ' + err.message);
  }
);

// Render loop
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
log('Render loop started ✅');

document.getElementById('btn').addEventListener('click', async () => {
  log('Button tapped ✅');

  try {
    log('Requesting camera...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
    document.getElementById('video').srcObject = stream;
    log('Camera ✅');
  } catch(err) {
    log('❌ Camera: ' + err.name + ' — ' + err.message);
    return;
  }

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const state = await DeviceOrientationEvent.requestPermission();
      log('Orientation: ' + state);
    } catch(err) {
      log('❌ Orientation: ' + err.message);
    }
  } else {
    log('Orientation: no permission needed');
  }

  window.addEventListener('deviceorientation', e => {
    const heading = e.webkitCompassHeading ?? (360 - e.alpha);
    const tilt = e.beta ?? 90;
    camera.rotation.order = 'YXZ';
    camera.rotation.y = -(heading * Math.PI / 180);
    camera.rotation.x = ((tilt - 90) * Math.PI / 180);
  });

  navigator.geolocation.getCurrentPosition(
    pos => log(`GPS ✅ ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`),
    err => log('❌ GPS: ' + err.message),
    { enableHighAccuracy: true }
  );

  document.getElementById('btn').style.display = 'none';
  log('--- Point phone forward — model should be visible ---');
});
</script>
</body>
</html>
