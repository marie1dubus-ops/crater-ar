<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Test</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: black; }

    #video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    #canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
    }

    #log {
      position: fixed;
      top: 10px; left: 10px;
      z-index: 99;
      background: rgba(0,0,0,0.8);
      color: lime;
      padding: 10px;
      font-size: 13px;
      font-family: monospace;
      border-radius: 8px;
      max-width: 90vw;
      max-height: 50vh;
      overflow-y: auto;
    }

    #btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      padding: 16px 40px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="log">Waiting for tap...<br></div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<button id="btn">Start AR Test</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const log = msg => {
  document.getElementById('log').innerHTML += msg + '<br>';
  console.log(msg);
};

// Three.js setup
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 0);
scene.add(camera);

// Just a red box, 5 meters in front of the camera
const box = new THREE.Mesh(
  new THREE.BoxGeometry(2, 2, 2),
  new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
box.position.set(0, 0, -5);
scene.add(box);

scene.add(new THREE.AmbientLight(0xffffff, 1));

// Render loop
function animate() {
  requestAnimationFrame(animate);
  box.rotation.y += 0.01; // spinning so you know it's live
  renderer.render(scene, camera);
}
animate();
log('Three.js render loop started ✅');

// Button click
document.getElementById('btn').addEventListener('click', async () => {
  log('Button tapped ✅');

  // Step 1: camera
  try {
    log('Requesting camera...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
    document.getElementById('video').srcObject = stream;
    log('Camera stream active ✅');
  } catch(err) {
    log('❌ Camera failed: ' + err.name + ' — ' + err.message);
    return;
  }

  // Step 2: orientation
  log('Requesting orientation...');
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const state = await DeviceOrientationEvent.requestPermission();
      log('Orientation permission: ' + state);
    } catch(err) {
      log('❌ Orientation permission error: ' + err.message);
    }
  } else {
    log('Orientation: no permission needed (non-iOS)');
  }

  window.addEventListener('deviceorientation', e => {
    const heading = e.webkitCompassHeading ?? (360 - e.alpha);
    const tilt = e.beta ?? 90;
    camera.rotation.order = 'YXZ';
    camera.rotation.y = -(heading * Math.PI / 180);
    camera.rotation.x = ((tilt - 90) * Math.PI / 180);
  });

  // Step 3: GPS
  log('Requesting GPS...');
  navigator.geolocation.getCurrentPosition(
    pos => log(`GPS ✅ ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`),
    err => log('❌ GPS: ' + err.message),
    { enableHighAccuracy: true }
  );

  document.getElementById('btn').style.display = 'none';
  log('--- Look around — you should see a spinning red box ---');
});
</script>
</body>
</html>
